<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Scrapbook</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdfbf7; 
            font-family: sans-serif;
            overflow: hidden; 
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Page number indicator in the top right */
        #pageIndicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.1);
            padding: 5px 15px;
            border-radius: 15px;
            color: #555;
            font-weight: bold;
            z-index: 1000;
        }

        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        button, label {
            background: #e2e8f0;
            border: none;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            touch-action: manipulation;
        }

        input[type="file"] {
            display: none;
        }

        .scrapbook-item {
            position: absolute;
            top: 50%;
            left: 50%;
            padding: 10px;
            background: white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            touch-action: none; 
            user-select: none;
        }

        .scrapbook-item img {
            max-width: 200px;
            display: block;
        }

        .scrapbook-item p {
            margin: 0;
            font-size: 18px;
            outline: none; 
        }
    </style>
</head>
<body>

    <div id="pageIndicator">Page 1</div>
    <div id="canvas"></div>

    <div id="toolbar">
        <button onclick="addText()">Add Text</button>
        <label for="imageUpload">Add Photo</label>
        <input type="file" id="imageUpload" accept="image/*" onchange="addImage(event)">
        <button onclick="savePage()" style="background: #a3b18a; color: white;">Save</button>
    </div>

    <script>
        // 1. Read the page number from the URL (default to 1 if missing)
        const urlParams = new URLSearchParams(window.location.search);
        const pageNum = urlParams.get('page') || '1';
        
        // 2. Create a unique filing cabinet name for this specific page
        const storageKey = 'journalPage_' + pageNum;

        // 3. Update the visual indicator on the screen
        document.getElementById('pageIndicator').innerText = 'Page ' + pageNum;

        const canvas = document.getElementById('canvas');

        // Update the save function to use the unique page key
        function savePage() {
            const canvasContent = canvas.innerHTML;
            localStorage.setItem(storageKey, canvasContent);
            alert("Page " + pageNum + " saved!");
        }

        // Update the load function to look for the unique page key
        window.onload = function() {
            const savedContent = localStorage.getItem(storageKey);
            if (savedContent) {
                canvas.innerHTML = savedContent;
            }
        };

        // Function to add a sticky note / text box
        function addText() {
            const el = document.createElement('div');
            el.className = 'scrapbook-item draggable';
            el.innerHTML = '<p contenteditable="true">Tap to type...</p>';
            el.setAttribute('data-x', 0);
            el.setAttribute('data-y', 0);
            canvas.appendChild(el);
        }

        // Function to add and compress an uploaded image
        function addImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const tempCanvas = document.createElement('canvas');
                        const ctx = tempCanvas.getContext('2d');

                        const MAX_WIDTH = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        tempCanvas.width = width;
                        tempCanvas.height = height;

                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = tempCanvas.toDataURL('image/jpeg', 0.7);

                        const el = document.createElement('div');
                        el.className = 'scrapbook-item draggable';
                        el.innerHTML = `<img src="${compressedDataUrl}" alt="scrapbook photo">`;
                        el.setAttribute('data-x', 0);
                        el.setAttribute('data-y', 0);
                        canvas.appendChild(el);
                    };
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // The Interact.js magic that makes things draggable
        interact('.draggable').draggable({
            listeners: {
                start (event) {
                    const items = document.querySelectorAll('.scrapbook-item');
                    items.forEach(item => item.style.zIndex = 1);
                    event.target.style.zIndex = 2;
                },
                move (event) {
                    const target = event.target;
                    const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                    const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                    target.style.transform = `translate(${x}px, ${y}px)`;
                    target.setAttribute('data-x', x);
                    target.setAttribute('data-y', y);
                }
            }
        });
    </script>
</body>
</html>
